<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>TaskGenX</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>:root{--a1:#4c5bff;--a2:#12b5e5;--line:rgba(255,255,255,.08)}*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:linear-gradient(180deg,#070c1f,#0b1430);color:#e8eefc;padding-bottom:86px}#splash{position:fixed;inset:0;background:linear-gradient(180deg,#070c1f,#0b1430);display:grid;place-items: center;z-index:9999;transition:opacity .6s}#splash.hide{opacity:0;pointer-events:none}.top{position:sticky;top:0;background:rgba(7,12,31,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;justify-content:space-between;align-items: center}.hero{margin:12px;background:linear-gradient(135deg,var(--a1),var(--a2));border-radius:22px;padding:14px}.balCard{background:#fff;color:#0f172a;border-radius:16px;padding:12px;display:flex;justify-content:space-between;align-items: center}.btn{padding:10px 12px;border-radius:999px;border:0;font-weight:900;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}.card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:12px;margin:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content: center;padding:0 10px 10px}.bottomInner{width:100%;max-width:520px;background:rgba(12,18,42,.78);border:1px solid var(--line);border-radius:22px;display:flex;justify-content:space-around;padding:8px}.tab{flex:1;display:flex;flex-direction:column;align-items: center;padding:8px;border:0;background:transparent;color:#8aa0c6;font-weight:800;font-size:10px}.tab.active{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}</style></head><body><div id="splash"><b>TaskGenX</b></div><div class="top"><b>TaskGenX</b><span id="userBadge">Loading</span></div><div style="max-width:520px;margin:0 auto"><section id="home"><div class="hero"><h2>Task to Earn</h2><div class="balCard"><div><div style="font-size:10px;color:#64748b">AVAILABLE BALANCE</div><b id="balance">Rs 0.00</b></div><div><button class="btn" style="background:#0f172a;color:#fff" onclick="go('deposit')">Deposit</button><button class="btn" style="background:#fff;color:#0f172a" onclick="go('withdraw')">Withdraw</button></div></div></div><div class="card" style="display:flex;justify-content:space-between;align-items: center"><div><b>Watch & Earn</b><div style="color:#94a3b8;font-size:12px">Watch ad & get reward</div></div><button class="btn btn-primary" onclick="goWatch()" id="watchBtn">Watch</button></div><div class="card"><b>Daily Check-in</b><div id="checkinGrid" class="grid"></div><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="go('checkin')">Check-in</button></div></section><section id="club" style="display:none"><div class="card"><h3>Club - Live Feed</h3><div id="liveFeed"></div></div></section><section id="task" style="display:none"><div class="card"><b>Tasks</b><div id="taskList"></div><button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="go('open_task')">Open in Bot</button></div></section><section id="referral" style="display:none"><div class="card"><h3>Invite & Earn</h3><input id="refLink" readonly/><div class="grid" style="margin-top:8px"><button class="btn btn-primary" onclick="copyRef()">Copy</button><a id="shareBtn" href="#" target="_blank" class="btn" style="display:grid;place-items: center;background:rgba(255,255,255,.06);color:#fff">Share</a></div></div></section><section id="profile" style="display:none"><div class="card"><h3>Profile</h3><div id="allLevels"></div><input id="upiId" placeholder="UPI"/><input id="walletNo" placeholder="Wallet 10 digits"/><button class="btn btn-primary" onclick="saveWithdraw()">Save</button></div></section></div><div class="bottom"><div class="bottomInner"><button class="tab active" id="tab-home" onclick="show('home')">Home</button><button class="tab" id="tab-club" onclick="show('club')">Club</button><button class="tab" id="tab-task" onclick="show('task')">Task</button><button class="tab" id="tab-referral" onclick="show('referral')">Refer</button><button class="tab" id="tab-profile" onclick="show('profile')">Profile</button></div></div><script>var tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;if(tg)try{tg.ready();tg.expand()}catch(e){}setTimeout(function(){var s=document.getElementById("splash");if(s)s.classList.add("hide")},800);var balVal="Rs 0.00";function show(id){document.querySelectorAll("section").forEach(function(s){s.style.display="none"});var el=document.getElementById(id);if(el)el.style.display="block";document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("active")});var t=document.getElementById("tab-"+id);if(t)t.classList.add("active")}function go(t){var p=JSON.stringify({type:t});if(tg&&tg.sendData)try{tg.sendData(p);return}catch(e){}location.href="https://t.me/TaskGenX_Bot?start="+t}function goWatch(){var b=document.getElementById("watchBtn");if(b.dataset.busy=="1")return;b.dataset.busy="1";b.innerText="Loading";setTimeout(function(){b.innerText="Watch";b.dataset.busy="0";go("watch_earn")},800)}function copyRef(){var e=document.getElementById("refLink");e.select();document.execCommand("copy");alert("Copied")}function saveWithdraw(){alert("Saved")}</script></body></html>
