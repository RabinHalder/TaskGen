<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TaskGen Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0f1e;--card:#111827;--muted:#94a3b8;--acc:#22c55e;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{margin:0;background:linear-gradient(180deg,#071024,#0f172a);color:#e5e7eb;padding-bottom:78px}
.top{position:sticky;top:0;z-index:20;background:rgba(7,16,36,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;display:flex;gap:8px;align-items:center}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#22c55e,#3b82f6);display:grid;place-items:center;color:#052e16;font-weight:900}
.badge{background:#0b1220;border:1px solid var(--line);color:#9ca3af;padding:6px 10px;border-radius:999px;font-size:12px}
.wrap{max-width:520px;margin:0 auto}
.hero{margin:14px 12px;background:linear-gradient(135deg,#0ea5e9 0%,#22c55e 55%,#0ea5e9 100%);border-radius:20px;padding:16px;color:#052e16}
.hero h2{margin:0 0 6px 0;font-size:18px}
.hero p{margin:0;opacity:.8;font-size:13px}
.balCard{background:#fff;border-radius:16px;padding:12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.balLeft .lbl{font-size:11px;letter-spacing:.6px;color:#475569;font-weight:800}
.balLeft b{font-size:22px;color:#0f172a}
.balBtns{display:flex;gap:8px}
.btn{padding:11px 14px;border-radius:12px;border:0;font-weight:900;cursor:pointer}
.btn-dark{background:#0f172a;color:#e2e8f0}
.btn-light{background:#fff;color:#0f172a;border:1px solid #e2e8f0}
.btn-primary{background:#22c55e;color:#052e16}
.btn-ghost{background:#1f2937;color:#e5e7eb}
.card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#0b1220;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.muted{color:var(--muted);font-size:13px}
.task{padding:12px;border-radius:16px;background:#0b1220;border:1px solid var(--line)}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #243041;background:#0b1220;color:#e5e7eb}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(15,23,42,.98);border-top:1px solid var(--line);display:flex;justify-content:space-around;gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:0;background:transparent;color:#94a3b8;font-weight:800;font-size:11px}
.tab.active{background:#22c55e;color:#052e16}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><i>T</i> TaskGen</div>
  <div class="badge" id="userBadge">Loading...</div>
</div>
<div class="wrap">
<section id="home">
  <div class="hero">
    <h2>Welcome to TaskGen</h2>
    <p>Earn by completing tasks & inviting friends</p>
    <div class="balCard">
      <div class="balLeft">
        <div class="lbl">AVAILABLE BALANCE</div>
        <b id="balance">₹ 0.00</b>
      </div>
      <div class="balBtns">
        <button class="btn btn-dark" onclick="go('deposit')">Deposit</button>
        <button class="btn btn-light" onclick="go('withdraw')">Withdraw</button>
      </div>
    </div>
    <div class="grid" style="margin-top:12px">
      <div class="kpi" style="background:#fff;color:#0f172a;border:0"><div style="font-size:11px;color:#475569;font-weight:800">TASKS DONE</div><b id="done">0</b></div>
      <div class="kpi" style="background:#fff;color:#0f172a;border:0"><div style="font-size:11px;color:#475569;font-weight:800">EARNED</div><b id="earned">₹ 0</b></div>
    </div>
  </div>
  <div class="card">
    <b>Quick Actions</b>
    <div class="grid" style="margin-top:10px">
      <button class="btn btn-primary" onclick="show('task')">🎯 Tasks</button>
      <button class="btn btn-ghost" onclick="show('referral')">🤝 Referral</button>
      <button class="btn btn-ghost" onclick="show('club')">👥 Club</button>
      <button class="btn btn-ghost" onclick="show('profile')">👤 Profile</button>
    </div>
  </div>
</section>
<section id="club" style="display:none">
  <div class="card">
    <h3>👥 Club</h3>
    <p class="muted">Join channel & group for bonus tasks.</p>
    <div class="grid">
      <a class="btn btn-ghost" id="clubCh" href="#" target="_blank">📢 Channel</a>
      <a class="btn btn-ghost" id="clubGr" href="#" target="_blank">👥 Group</a>
    </div>
  </div>
</section>
<section id="task" style="display:none">
  <div class="card">
    <h3>🎯 Tasks</h3>
    <div id="taskList" class="grid"></div>
    <button class="btn btn-primary" style="margin-top:12px;width:100%" onclick="go('open_task')">Open Tasks in Bot</button>
  </div>
</section>
<section id="referral" style="display:none">
  <div class="card">
    <h3>🤝 Referral</h3>
    <input id="refLink" readonly/>
    <div class="grid" style="margin-top:10px">
      <button class="btn btn-primary" onclick="copyRef()">Copy Link</button>
      <a class="btn btn-ghost" id="shareBtn" href="#" target="_blank">Share</a>
    </div>
  </div>
</section>
<section id="profile" style="display:none">
  <div class="card">
    <h3>👤 Profile</h3>
    <div class="grid"><div class="kpi"><div class="muted">User ID</div><b id="uid">--</b></div><div class="kpi"><div class="muted">Name</div><b id="uname">--</b></div></div>
    <div class="grid" style="margin-top:10px">
      <button class="btn btn-ghost" onclick="go('deposit')">Deposit</button>
      <button class="btn btn-ghost" onclick="go('withdraw')">Withdraw</button>
    </div>
  </div>
</section>
</div>
<nav class="bottom">
  <button class="tab active" id="tab-home" onclick="show('home')">🏠<span>Home</span></button>
  <button class="tab" id="tab-club" onclick="show('club')">👥<span>Club</span></button>
  <button class="tab" id="tab-task" onclick="show('task')">🎯<span>Task</span></button>
  <button class="tab" id="tab-referral" onclick="show('referral')">🤝<span>Referral</span></button>
  <button class="tab" id="tab-profile" onclick="show('profile')">👤<span>Profile</span></button>
</nav>
<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
function show(id){
  document.querySelectorAll('section').forEach(function(s){s.style.display='none';});
  var el=document.getElementById(id); if(el) el.style.display='block';
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('active');});
  var t=document.getElementById('tab-'+id); if(t) t.classList.add('active');
  window.scrollTo(0,0);
  if(tg && tg.HapticFeedback) try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
}
function go(type){
  var payload = JSON.stringify({type:type, at:Date.now()});
  if(tg && typeof tg.sendData === 'function'){
    try{ tg.sendData(payload); return; }catch(e){ alert('sendData failed: '+e.message); }
  }
  // fallback if not opened via keyboard button - open bot deep link
  var bot = 'TaskGenX_Bot';
  try{
    if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user) { /* keep bot */ }
  }catch(e){}
  var url='https://t.me/'+bot+'?start='+type;
  if(tg && tg.openTelegramLink){ try{ tg.openTelegramLink(url); return;}catch(e){} }
  if(tg && tg.openLink){ try{ tg.openLink(url); return;}catch(e){} }
  window.location.href=url;
}
function copyRef(){
  var el=document.getElementById('refLink');
  el.select(); document.execCommand('copy');
  alert('Copied!');
}
try{
  var u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if(u){
    document.getElementById('uname').innerText = (u.first_name||'')+' '+(u.last_name||'');
    document.getElementById('uid').innerText = u.id;
    document.getElementById('userBadge').innerText = '@'+(u.username||u.id);
    var bot='TaskGenX_Bot';
    var link='https://t.me/'+bot+'?start='+u.id;
    document.getElementById('refLink').value=link;
    document.getElementById('shareBtn').href='https://t.me/share/url?url='+encodeURIComponent(link);
  }
}catch(e){}
var demo=[{title:'Join Channel',reward:2},{title:'Join Group',reward:2},{title:'Visit Link',reward:1},{title:'Submit Proof',reward:5}];
var list=document.getElementById('taskList');
demo.forEach(function(t){
  var d=document.createElement('div'); d.className='task';
  d.innerHTML='<b>'+t.title+'</b><div class="muted">Reward: Rs.'+t.reward+'</div><button class="btn btn-primary" style="margin-top:8px;width:100%" onclick="go(\'open_task\')">Open</button>';
  list.appendChild(d);
});
</script>
</body>
</html>
